<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PayWise — AI Payment Resolution</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg-primary:          #F8F9FA;
  --bg-surface:          #FFFFFF;
  --bg-surface-elevated: #F1F3F5;

  --color-primary:        #7C4DFF;
  --color-primary-hover:  #6A3FE8;
  --color-secondary:      #00E5FF;
  --gradient-brand: linear-gradient(135deg, #7C4DFF, #00E5FF);

  --color-apply:          #10B981;
  --color-apply-hover:    #059669;
  --color-apply-tint:     rgba(16, 185, 129, 0.10);

  --color-hold:           #F59E0B;
  --color-hold-hover:     #D97706;
  --color-hold-tint:      rgba(245, 158, 11, 0.10);

  --color-escalate:       #EF4444;
  --color-escalate-hover: #DC2626;
  --color-escalate-tint:  rgba(239, 68, 68, 0.10);

  --color-info:           #3B82F6;
  --color-info-tint:      rgba(59, 130, 246, 0.10);

  --text-primary:   #1E293B;
  --text-secondary: #64748B;
  --text-muted:     #94A3B8;

  --border-color: #E2E8F0;
  --border-focus: var(--color-primary);

  --space-1:  4px; --space-2:  8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;

  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-full: 9999px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
  --shadow-xl: 0 20px 40px rgba(0,0,0,0.12);

  --font-sans:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;
  --font-display: 'DM Sans', -apple-system, sans-serif;

  --text-xs: 11px; --text-sm: 12px; --text-base: 14px; --text-md: 16px; --text-lg: 20px; --text-xl: 24px;
  --leading-base: 1.5;
  --font-normal: 400; --font-medium: 500; --font-semibold: 600; --font-bold: 700;
  --transition: all 160ms ease;
  --nav-height: 56px; --footer-height: 30px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { overflow-x: hidden; }
body {
  overflow-x: hidden;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-base);
  color: var(--text-primary);
  background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
button, input, textarea, select { font-family: var(--font-sans); }
button { cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: var(--radius-full); }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label-caps { font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.07em; }

.card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: var(--font-semibold); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.badge-apply    { background: var(--color-apply-tint);    color: var(--color-apply); }
.badge-hold     { background: var(--color-hold-tint);     color: var(--color-hold); }
.badge-escalate { background: var(--color-escalate-tint); color: var(--color-escalate); }
.badge-primary  { background: var(--color-primary); color: #fff; }
.badge-neutral  { background: var(--bg-surface-elevated); color: var(--text-secondary); }
.badge-flag     { background: var(--color-hold-tint); color: var(--color-hold); text-transform: none; font-weight: var(--font-medium); }
.badge-count    { padding: 1px 8px; text-transform: none; letter-spacing: 0; font-weight: var(--font-semibold); }
.badge-count.active { background: var(--color-primary); color: #fff; }
.badge-count:not(.active) { background: var(--bg-surface-elevated); color: var(--text-secondary); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-md); font-size: var(--text-base); font-weight: var(--font-semibold); cursor: pointer; transition: var(--transition); border: 1px solid transparent; line-height: 1; }
.btn-primary  { background: var(--color-primary);  color: #fff; }
.btn-primary:hover  { background: var(--color-primary-hover); }
.btn-apply    { background: var(--color-apply);    color: #fff; }
.btn-apply:hover    { background: var(--color-apply-hover); }
.btn-hold     { background: var(--color-hold);     color: #fff; }
.btn-hold:hover     { background: var(--color-hold-hover); }
.btn-escalate { background: var(--color-escalate); color: #fff; }
.btn-escalate:hover { background: var(--color-escalate-hover); }
.btn-ghost { background: transparent; color: var(--text-primary); border-color: var(--border-color); }
.btn-ghost:hover { background: var(--bg-surface-elevated); }
.btn-outline-escalate { background: transparent; color: var(--color-escalate); border-color: var(--color-escalate); }
.btn-outline-escalate:hover { background: var(--color-escalate-tint); }
.btn-sm { padding: 5px 12px; font-size: var(--text-sm); border-radius: var(--radius-sm); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.view { animation: fadeUp .2s ease; }

/* ---- layout shell ---- */
#nav { height: var(--nav-height); background: var(--bg-surface); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
#nav .left { display: flex; align-items: center; gap: 10px; }
#nav .right { display: flex; align-items: center; gap: 14px; }
.searchbox { display: flex; align-items: center; gap: 8px; background: var(--bg-surface-elevated); border-radius: var(--radius-md); padding: 7px 12px; width: 220px; color: var(--text-muted); }
.searchbox input { background: none; border: none; outline: none; font-size: var(--text-sm); color: var(--text-primary); flex: 1; }
.searchbox kbd { font-size: 10px; color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 4px; padding: 1px 5px; font-family: var(--font-sans); }
.icon-btn { width: 34px; height: 34px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); background: transparent; border: none; position: relative; }
.icon-btn:hover { background: var(--bg-surface-elevated); }
.dot-red { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--color-escalate); border: 1.5px solid var(--bg-surface); }

#main { max-width: 1360px; margin: 0 auto; padding: 28px 24px 60px; flex: 1; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.page-head h1 { font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--text-primary); letter-spacing: -0.3px; }
.page-head .sub { font-size: var(--text-sm); color: var(--text-secondary); margin-top: 3px; }
.page-head .meta-r { text-align: right; }
.page-head .meta-r .top { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
.page-head .meta-r .date { font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--text-primary); margin-top: 2px; }

.stat-row { display: flex; gap: 12px; margin-bottom: 20px; }
.stat-card { flex: 1; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.stat-card .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-card .lbl { font-size: var(--text-xs); font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin-bottom: 3px; }
.stat-card .val { font-size: 22px; font-weight: var(--font-bold); color: var(--text-primary); line-height: 1.1; }
.stat-card .val .sub { font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--text-secondary); margin-left: 5px; }

.tabs { display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--border-color); }
.tab { display: flex; align-items: center; gap: 7px; padding: 14px 0; font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--text-secondary); border-bottom: 2px solid transparent; cursor: pointer; }
.tab.active { color: var(--text-primary); border-bottom-color: var(--color-primary); }
.toolbar { margin-left: auto; display: flex; gap: 8px; padding: 10px 0; }
.select-fake { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 6px 10px; color: var(--text-secondary); background: var(--bg-surface); }

.table-wrap { overflow-x: auto; }
table { width: 100%; min-width: 760px; border-collapse: collapse; }
thead th { text-align: left; font-size: 10.5px; font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 10px 20px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
tbody td { padding: 13px 20px; font-size: var(--text-sm); border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
tbody tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; transition: var(--transition); }
tbody tr:hover td { background: var(--bg-surface-elevated); }
.id-link { color: var(--color-primary); font-weight: var(--font-semibold); }
.foot-note { padding: 12px 20px; font-size: var(--text-xs); color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

.grid-2 { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.back-btn { width: 34px; height: 34px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-surface); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); margin-bottom: 12px; }
.back-btn:hover { background: var(--bg-surface-elevated); }

.rec-box { border-radius: var(--radius-md); padding: 16px 18px; border: 1px solid; }
.rec-box .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.rec-box .rk { font-size: var(--text-xs); font-weight: var(--font-bold); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.rec-box .conf { font-size: 22px; font-weight: var(--font-bold); }
.rec-box .title { font-size: 17px; font-weight: var(--font-bold); margin-bottom: 6px; }
.rec-box .reason { font-size: var(--text-sm); line-height: 1.55; }

.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; background: var(--bg-surface-elevated); border-radius: var(--radius-md); padding: 14px 16px; margin: 14px 0; }
.kv-grid .k { font-size: 10.5px; font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin-bottom: 2px; }
.kv-grid .v { font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--text-primary); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
.field { display: flex; align-items: flex-start; gap: 9px; }
.field .fi { color: var(--text-muted); margin-top: 2px; flex-shrink: 0; }
.field .fk { font-size: 10.5px; font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin-bottom: 2px; }
.field .fv { font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--text-primary); }

.section-card .sc-head { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.section-card .sc-head h3 { font-size: var(--text-md); font-weight: var(--font-semibold); }
.section-card .sc-body { padding: 16px 20px; }
.section-card .sc-body.hidden { display: none; }
.chev { transition: var(--transition); color: var(--text-secondary); }
.chev.open { transform: rotate(180deg); }

.side-card h3 { font-size: var(--text-base); font-weight: var(--font-semibold); padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
.side-card .rows { padding: 15px 20px; display: flex; flex-direction: column; gap: 13px; }
.side-card .row .k { font-size: 10.5px; font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin-bottom: 2px; }
.side-card .row .v { font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--text-primary); }
.meta-card { background: var(--bg-surface-elevated); border-radius: var(--radius-lg); padding: 14px 16px; font-size: var(--text-xs); color: var(--text-secondary); line-height: 1.7; }
.meta-card b { color: var(--text-primary); }

.signal { margin-bottom: 12px; }
.signal .sr { display: flex; justify-content: space-between; margin-bottom: 4px; }
.signal .sn { font-size: var(--text-sm); color: var(--text-secondary); }
.signal .sl { font-size: var(--text-xs); color: var(--text-primary); font-weight: var(--font-medium); }
.signal .track { height: 6px; background: var(--bg-surface-elevated); border-radius: 999px; overflow: hidden; }
.signal .fill { height: 100%; border-radius: 999px; }

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
.tl-item:not(:last-child)::before { content: ''; position: absolute; left: 4.5px; top: 14px; bottom: 0; width: 1.5px; background: var(--border-color); }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-primary); margin-top: 4px; flex-shrink: 0; z-index: 1; }
.tl-item.system .tl-dot { background: var(--text-muted); }
.tl-time { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }
.tl-txt { font-size: var(--text-sm); color: var(--text-primary); margin-top: 2px; }
.tl-txt b { font-weight: var(--font-semibold); }

.avatar { width: 32px; height: 32px; border-radius: 50%; background: #0F172A; display: flex; align-items: center; justify-content: center; font-weight: var(--font-bold); color: #fff; font-size: 12px; flex-shrink: 0; }
.avatar.lg { width: 40px; height: 40px; font-size: 14px; }

.dropdown { position: absolute; top: 46px; right: 0; width: 268px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); z-index: 100; overflow: hidden; }
.dropdown .who { display: flex; gap: 10px; align-items: center; padding: 14px 16px; }
.dropdown .who .name { font-size: var(--text-sm); font-weight: var(--font-semibold); }
.dropdown .who .email { font-size: 11px; color: var(--text-secondary); }
.dropdown .who .role { font-size: 11px; color: var(--color-primary); font-weight: var(--font-medium); }
.dropdown .grp-label { padding: 8px 16px 4px; font-size: 10px; font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
.dropdown .item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: var(--text-sm); color: var(--text-primary); cursor: pointer; }
.dropdown .item:hover { background: var(--bg-surface-elevated); }
.dropdown .item .em { font-size: 15px; width: 18px; text-align: center; }
.dropdown .item.sel { color: var(--color-primary); font-weight: var(--font-semibold); }
.dropdown hr { border: none; border-top: 1px solid var(--border-color); margin: 4px 0; }
.dropdown .item.danger { color: var(--color-escalate); }

#footer { height: var(--footer-height); border-top: 1px solid var(--border-color); background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
#footer .live { display: flex; align-items: center; gap: 6px; }
#footer .live .d { width: 6px; height: 6px; border-radius: 50%; background: var(--color-apply); }
kbd.k { font-size: 10px; border: 1px solid var(--border-color); border-radius: 4px; padding: 1px 5px; }

.bars { display: flex; align-items: flex-end; gap: 14px; height: 110px; }
.bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; height: 100%; }
.bars .seg { width: 100%; border-radius: 2px; }
.bars .lbl { font-size: 10.5px; color: var(--text-secondary); margin-top: 6px; }
.legend { display: flex; gap: 16px; margin-top: 14px; }
.legend .li { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-secondary); }
.legend .sw { width: 8px; height: 8px; border-radius: 2px; }

.approval-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-top: 1px solid var(--border-color); }
.approval-row:first-child { border-top: none; }
.approval-row .t { font-size: var(--text-sm); font-weight: var(--font-semibold); }
.approval-row .d { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
.approval-row .btns { display: flex; gap: 8px; flex-shrink: 0; }

.threshold-card { margin-bottom: 16px; }
.threshold-card .tags { display: flex; gap: 8px; margin-bottom: 10px; }
.threshold-card h4 { font-size: var(--text-md); font-weight: var(--font-semibold); margin-bottom: 10px; }
.threshold-card .vals { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pillval { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--font-semibold); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 3px 10px; background: var(--bg-surface-elevated); color: var(--text-secondary); }
.pillval.proposed { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.threshold-card .note { font-size: var(--text-sm); color: var(--text-primary); margin-bottom: 4px; }
.threshold-card .impact { font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }

@media (max-width: 980px) {
  .grid-2 { grid-template-columns: 1fr; }
  .stat-row { flex-wrap: wrap; }
  .stat-card { min-width: 45%; }
}
</style>
</head>

<div id="nav"></div>
<div id="main"></div>
<div id="footer"></div>

/* ============================= HELPERS ============================= */
function fmt(n){ return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function recColor(rec){ return rec==='APPLY' ? 'apply' : rec==='HOLD' ? 'hold' : 'escalate'; }
function recBadge(rec){ return `<span class="badge badge-${recColor(rec)}">${rec}</span>`; }
function confText(v, rec){ const c = getComputedStyle(document.documentElement).getPropertyValue('--color-'+recColor(rec)); return `<span class="mono" style="font-size:13px;font-weight:700;color:${c}">${v}%</span>`; }
function flagBadge(f){ return f ? `<span class="badge badge-flag">${ic('alert',11)} ${f}</span>` : ''; }
function riskBadge(level){ const cls = level==='high'?'escalate':level==='medium'?'hold':'apply'; return `<span class="badge badge-${cls}" style="text-transform:capitalize">${level}</span>`; }
function statusBadge(s){ const map = {'New':'primary','Pending Outreach':'hold','Resolved':'apply'}; return `<span class="badge badge-${map[s]||'neutral'}" style="text-transform:none">${s}</span>`; }

function statCard(label, val, sub, icon, colorVar){
  return `<div class="stat-card">
    <div class="ic" style="background:var(--color-${colorVar}-tint,rgba(59,130,246,.1));color:var(--color-${colorVar},#3B82F6)">${ic(icon,18)}</div>
    <div><div class="lbl">${label}</div><div class="val">${val}${sub?`<span class="sub">${sub}</span>`:''}</div></div>
  </div>`;
}

function signalBar(name, value, label, forceColor){
  const color = forceColor || (value>=90?'apply':value>=70?'hold':'escalate');
  return `<div class="signal">
    <div class="sr"><span class="sn">${name}</span><span class="sl">${label}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(4,value)}%;background:var(--color-${color})"></div></div>
  </div>`;
}

function recBox(rec, conf, reasoning){
  const c = recColor(rec);
  const icon = rec==='APPLY' ? 'check' : rec==='HOLD' ? 'clock' : 'alert';
  return `<div class="rec-box" style="background:var(--color-${c}-tint);border-color:var(--color-${c})">
    <div class="top-row">
      <span class="rk" style="color:var(--color-${c})">${ic(icon,14)} AI Recommendation</span>
      <span class="conf" style="color:var(--color-${c})">${conf}%</span>
    </div>
    <div class="title" style="color:var(--color-${c})">${rec}</div>
    <div class="reason">${reasoning}</div>
  </div>`;
}

function sectionCard(id, title, bodyHtml, collapsible, open){
  open = open !== false;
  return `<div class="card section-card">
    <div class="sc-head" onclick="${collapsible?`toggleSection('${id}')`:''}">
      <h3>${title}</h3>
      ${collapsible?`<span class="chev ${open?'open':''}" id="chev-${id}">${ic('chevdown',16)}</span>`:''}
    </div>
    <div class="sc-body ${open?'':'hidden'}" id="body-${id}">${bodyHtml}</div>
  </div>`;
}
function toggleSection(id){
  document.getElementById('body-'+id).classList.toggle('hidden');
  document.getElementById('chev-'+id).classList.toggle('open');
}

function timeline(entries){
  return `<div class="timeline">${entries.map(([t,user,action,detail],i)=>`
    <div class="tl-item ${user==='System'?'system':''}">
      <div class="tl-dot"></div>
      <div style="flex:1">
        <div class="tl-time">${t}</div>
        <div class="tl-txt"><b>${user}:</b> ${action} — ${detail}</div>
      </div>
    </div>`).join('')}</div>`;
}

            <div class="row"><div class="k">Resolution Action</div><div class="select-fake" style="margin-top:4px;width:100%;justify-content:space-between">Select action... ${ic('chevdown',13)}</div></div>
            <div class="row"><div class="k">Investigation Summary</div>
              <textarea placeholder="Summarize investigation findings and rationale" style="width:100%;margin-top:4px;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:8px 10px;font-size:var(--text-sm);min-height:70px;resize:vertical;font-family:var(--font-sans)"></textarea>
            </div>
            <button class="btn btn-primary" disabled>Submit &amp; Close Case</button>
          </div>
        </div>
        <div class="meta-card"><div><b>Case ID:</b> ${state.caseId}</div><div><b>Opened:</b> March 31, 2026, 8:42 AM</div><div><b>Status:</b> Open — Awaiting Decision</div></div>
      </div>
    </div>
  </div>`;
}

function bar3(apply, hold, escalate){
  const cA = 'var(--color-apply)', cH='var(--color-hold)', cE='var(--color-escalate)';
  return `<div class="stack" style="gap:12px">
    ${[['APPLY',apply,cA],['HOLD',hold,cH],['ESCALATE',escalate,cE]].map(([l,v,c])=>`
    <div>
      <div style="display:flex;justify-content:space-between;font-size:var(--text-sm);margin-bottom:5px">
        <span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:${c}"></span>${l}</span>
        <span class="mono" style="color:var(--text-secondary)">${v.n} cases <b style="color:var(--text-primary);margin-left:6px">${v.p}%</b></span>
      </div>
      <div class="track" style="height:8px"><div class="fill" style="width:${v.p}%;background:${c}"></div></div>
    </div>`).join('')}
  </div>`;
}

    <div class="grid-2" style="grid-template-columns:1fr 1fr">
      <div class="card" style="padding:20px">
        <h3 style="font-size:var(--text-md);font-weight:700;margin-bottom:16px">Decision Distribution</h3>
        ${bar3({n:848,p:68},{n:274,p:22},{n:125,p:10})}
      </div>
      <div class="card" style="padding:20px">
        <h3 style="font-size:var(--text-md);font-weight:700;margin-bottom:14px">SLA Status</h3>
        <div class="stack" style="gap:12px">
          ${[['Within SLA','1176 cases','94.3%','apply'],['At Risk (approaching SLA)','47 cases','3.8%','hold'],['SLA Exceeded','24 cases','1.9%','escalate']].map(([l,n,p,c])=>`
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="display:flex;align-items:center;gap:8px;font-size:var(--text-sm)"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-${c})"></span>${l}</span>
            <span style="font-size:var(--text-sm)"><span class="mono" style="color:var(--text-secondary)">${n}</span> <b style="color:var(--color-${c});margin-left:8px">${p}</b></span>

          <div class="li"><span class="sw" style="background:var(--color-hold)"></span>Hold</div>
          <div class="li"><span class="sw" style="background:var(--color-escalate)"></span>Escalate</div>

function viewAdminDashboard(){
  const cards = [
    { tag:'AI Thresholds', status:'PENDING', title:'Auto-apply Confidence Threshold', cur:'90%', prop:'93%', note:'Override rate in 90–92% band increased from 3% to 11% over 4 weeks.', impact:'Est. 8% reduction in auto-apply volume · Proposed by Marcus Sundaram', showBtns:true },
    { tag:'Detection Rules', status:'APPROVED', title:'Duplicate Detection Window', cur:'72 hours', prop:'96 hours', note:'4 duplicate payments occurred just outside the 72-hour window last quarter.', impact:'Est. 12% increase in duplicate detection · Proposed by Marcus Sundaram', showBtns:false },
    { tag:'Risk Controls', status:'PENDING', title:'Fraud Risk Sensitivity', cur:'MEDIUM', prop:'HIGH', note:'Recent uptick in suspicious transactions flagged post-processing.', impact:'Est. 5% increase in hold rate · Proposed by Marcus Sundaram', showBtns:true },
  ];
  const cardsHtml = cards.map(c=>`
    <div class="card threshold-card" style="padding:18px 20px">
      <div class="tags"><span class="badge badge-neutral" style="text-transform:none">${c.tag}</span><span class="badge ${c.status==='PENDING'?'badge-hold':'badge-apply'}">${c.status}</span></div>
      <h4>${c.title}</h4>
      <div class="vals"><span class="pillval">Current: ${c.cur}</span>${ic('chevdown',14)}<span class="pillval proposed">Proposed: ${c.prop}</span></div>
      <div class="note">${c.note}</div>
      <div class="impact">Impact: ${c.impact}</div>
      ${c.showBtns?`<div style="display:flex;gap:8px"><button class="btn btn-apply btn-sm">Approve Change</button><button class="btn btn-ghost btn-sm">Reject</button></div>`:''}
    </div>`).join('');
  return `<div class="view">
    <div class="page-head">
      <div><h1>System Configuration</h1><div class="sub">AI thresholds, detection rules &amp; simulation mode</div></div>
      <div class="select-fake"><span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block"></span> Simulation Mode</div>
    </div>
    <div class="stat-row">
      ${statCard('Total Cases Processed','12,847','+8.3%','file','info')}
      ${statCard('AI Accuracy Rate','94.2%','+2.1%','check','apply')}
      ${statCard('Avg Processing Time','0.8s','-12%','zap','hold')}
      ${statCard('Cost per Resolution','$0.023','-5.4%','dollar','apply')}
    </div>
    ${cardsHtml}
  </div>`;
}

/* ============================= ROUTER ============================= */
const state = { role:'analyst', view:'dashboard', caseId:null };
function openCase(id){ state.view='case'; state.caseId=id; render(); }
function openInvCase(id){ state.view='invcase'; state.caseId=id; render(); }

function render(){
  renderNav();
  renderFooter();
  let html = '';
  if (state.role==='analyst')      html = state.view==='case' ? viewCaseDetail() : viewAnalystDashboard();
  if (state.role==='investigator') html = state.view==='invcase' ? viewInvCaseDetail() : viewInvestigatorDashboard();
  if (state.role==='director')     html = viewDirectorDashboard();
  if (state.role==='admin')        html = viewAdminDashboard();
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}
render();
</script>
